# Vector configuration for Pareton log shipping to Axiom.
# Deploy to /etc/vector/vector.toml on the production droplet.
# Token comes from /opt/pareton/.env (PARETON_AXIOM_TOKEN).
#
# Install: https://vector.dev/docs/setup/installation/
# Axiom sink: https://vector.dev/docs/reference/configuration/sinks/axiom/

[sources.journald]
type = "journald"
include_units = ["pareton-worker", "pareton-api", "pareton-gpu-reap"]

[transforms.drop_noise]
type = "filter"
inputs = ["journald"]
condition = '.MESSAGE !~ "(?i)debug|trace"'

[sinks.axiom]
type = "axiom"
inputs = ["drop_noise"]
token = "${PARETON_AXIOM_TOKEN}"
dataset = "pareton-prod"

[sinks.axiom.buffer]
type = "disk"
max_size = 536870912
