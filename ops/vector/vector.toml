# Vector configuration for Pareton log shipping to Axiom.
# Deploy to /etc/vector/vector.toml on the production droplet.
# Token comes from /opt/pareton/.env (PARETON_AXIOM_TOKEN).
#
# Install: https://vector.dev/docs/setup/installation/
# Axiom sink: https://vector.dev/docs/reference/configuration/sinks/axiom/

[sources.journald]
type = "journald"
include_units = ["pareton-worker", "pareton-watcher", "pareton-api", "pareton-weights", "pareton-gpu-reap"]

[transforms.drop_noise]
type = "filter"
inputs = ["journald"]
# Keep structured lifecycle JSON (always contains "event":). For other lines,
# drop DEBUG-level noise (log format pads the level to 7 chars: " DEBUG  ").
# Traceback lines survive: they carry failure details.
condition = '''
  contains(string!(.message), "\"event\":") || !match(string!(.message), r' DEBUG  ')
'''

# Lifecycle events arrive as "INFO pareton.lifecycle: {json}". Unwrap the JSON
# into top-level fields so APL (where event == "heartbeat") can match.
[transforms.parse_lifecycle]
type = "remap"
inputs = ["drop_noise"]
source = '''
  msg = string!(.message)
  if contains(msg, "\"event\":") {
    extracted, err = parse_regex(msg, r'(?P<json>\{.*\})$')
    if err == null {
      parsed, err = parse_json(extracted.json)
      if err == null && is_object(parsed) {
        . = merge!(., parsed)
      }
    }
  }
'''

[sinks.axiom]
type = "axiom"
inputs = ["parse_lifecycle"]
token = "${PARETON_AXIOM_TOKEN}"
dataset = "pareton-prod"

[sinks.axiom.buffer]
type = "disk"
max_size = 536870912
