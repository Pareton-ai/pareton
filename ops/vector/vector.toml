# Vector configuration for Pareton log shipping to Axiom.
# Deploy to /etc/vector/vector.toml on the production droplet.
# Token comes from /opt/pareton/.env (PARETON_AXIOM_TOKEN).
#
# Install: https://vector.dev/docs/setup/installation/
# Axiom sink: https://vector.dev/docs/reference/configuration/sinks/axiom/

[sources.journald]
type = "journald"
include_units = ["pareton-worker", "pareton-api", "pareton-gpu-reap"]

[transforms.drop_noise]
type = "filter"
inputs = ["journald"]
# Keep structured lifecycle JSON (always contains "event":). For other lines,
# drop DEBUG/TRACE noise. Do not match bare "trace" — it drops lifecycle errors
# like trace_fetch_failed and bench_report_trace_sha256_mismatch.
condition = 'includes(string!(.MESSAGE), "\"event\":") || !match(string!(.MESSAGE), r''(?i)debug|trace'')'

[sinks.axiom]
type = "axiom"
inputs = ["drop_noise"]
token = "${PARETON_AXIOM_TOKEN}"
dataset = "pareton-prod"

[sinks.axiom.buffer]
type = "disk"
max_size = 536870912
