# Builds run in dockerd's embedded BuildKit, so the compile is charged to
# docker.service and not to pareton-worker.service. MemoryHigh throttles and
# reclaims; a hard MemoryMax would OOM a multi-hour compile at its peak.
# Provisional for the 16GB validator; revise once a build has been measured.
#
# These caps bind only while the RUN steps stay inside docker.service's cgroup.
# That holds for the embedded builder, whose executor containers are not docker
# containers and get no scope unit of their own, but it has not been confirmed
# on the validator. Verify during the first measured build:
#
#   systemd-cgls /sys/fs/cgroup/system.slice/docker.service
#   systemctl show docker.service -p MemoryHigh -p CPUWeight -p IOWeight
#
# If the compile appears in a docker-<id>.scope sibling instead, these caps do
# not bind and capping needs a dedicated slice plus a cgroup-parent daemon
# setting, which sync-config.py cannot install today. The protections on the
# pareton units hold either way; they do not depend on where the compile runs.
[Service]
MemoryAccounting=yes
MemoryHigh=9G
CPUAccounting=yes
CPUWeight=50
IOAccounting=yes
IOWeight=50
