# Keep the control services responsive while a build saturates the host.
# MemoryLow protects against reclaim, it does not reserve: unused memory stays
# available. Weights above docker.service's 50 give these units priority.
[Service]
MemoryAccounting=yes
MemoryLow=384M
CPUAccounting=yes
CPUWeight=200
IOAccounting=yes
IOWeight=200
