# Captured 2026-09-10 from /etc/systemd/system/pareton-worker.service.d/queue.conf.
# An empty ExecStart= clears the main unit's line so submissions get their
# own queue; round execution moved to pareton-round-worker.service (#149).
[Service]
ExecStart=
ExecStart=/opt/pareton/.venv/bin/python -m worker.main --queue submissions
