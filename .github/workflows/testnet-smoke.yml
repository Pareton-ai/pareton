name: Testnet Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: pareton-testnet-smoke
  cancel-in-progress: false

jobs:
  commit-to-built:
    name: Commit to watcher to built
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: pareton-test
    env:
      PARETON_DATABASE_URL: ${{ secrets.PARETON_TEST_DATABASE_URL }}
      PARETON_TEST_DATABASE_URL: ${{ secrets.PARETON_TEST_DATABASE_URL }}
      PARETON_NETWORK: test
      PARETON_NETUID: "543"
      PARETON_POLL_INTERVAL_S: "10"
      PARETON_S3_PUBLIC_BASE_URL: http://127.0.0.1:9000
      PARETON_S3_PREFIX: stage0
      CI_TESTNET_HOTKEY: 5DUbY9wprDsAhVUbHQqyTrQ4pgAwYQ7FgTZ4476xN4gSuD1U
      CI_WALLET_NAME: pareton-ci-smoke
      CI_WALLET_HOTKEY: pareton-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check test database
        run: python scripts/testnet_smoke.py check-db

      - name: Restore CI testnet hotkey
        env:
          CI_TESTNET_WALLET_SEED: ${{ secrets.CI_TESTNET_WALLET_SEED }}
        run: |
          python scripts/testnet_smoke.py restore-wallet \
            --wallet-name "$CI_WALLET_NAME" \
            --wallet-hotkey "$CI_WALLET_HOTKEY" \
            --expected-hotkey "$CI_TESTNET_HOTKEY"

      - name: Prepare campaign and unique patch
        id: prepare
        run: |
          python scripts/testnet_smoke.py prepare \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --hotkey "$CI_TESTNET_HOTKEY" \
            --http-root "$RUNNER_TEMP/pareton-http"

      - name: Start API, patch server, watcher, and worker
        run: |
          mkdir -p "$RUNNER_TEMP/pareton-logs"

          python -m http.server 9000 \
            --bind 127.0.0.1 \
            --directory "$RUNNER_TEMP/pareton-http" \
            >"$RUNNER_TEMP/pareton-logs/patch-server.log" 2>&1 &
          echo $! >> "$RUNNER_TEMP/pareton-pids"

          python -m api >"$RUNNER_TEMP/pareton-logs/api.log" 2>&1 &
          echo $! >> "$RUNNER_TEMP/pareton-pids"

          python -m worker.watcher \
            >"$RUNNER_TEMP/pareton-logs/watcher.log" 2>&1 &
          echo $! >> "$RUNNER_TEMP/pareton-pids"

          python -m worker.main --mock-build \
            >"$RUNNER_TEMP/pareton-logs/worker.log" 2>&1 &
          echo $! >> "$RUNNER_TEMP/pareton-pids"

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "API did not become healthy" >&2
          exit 1

      - name: Commit patch on Bittensor testnet
        run: |
          python -m miner.commit_patch \
            --campaign-id "${{ steps.prepare.outputs.campaign_id }}" \
            --patch "${{ steps.prepare.outputs.patch_path }}" \
            --retrieval-url "${{ steps.prepare.outputs.retrieval_url }}" \
            --api-base http://127.0.0.1:8000 \
            --wallet-name "$CI_WALLET_NAME" \
            --wallet-hotkey "$CI_WALLET_HOTKEY" \
            --network test \
            --netuid 543

      - name: Poll for built state
        id: poll
        run: |
          set +e
          python scripts/testnet_smoke.py poll \
            --patch-hash "${{ steps.prepare.outputs.patch_hash }}" \
            --timeout-s 900 \
            --interval-s 10
          result_code=$?
          set -e
          echo "result_code=$result_code" >> "$GITHUB_OUTPUT"

      - name: Print failure diagnostics
        if: failure() || (steps.poll.outputs.result_code != '' && steps.poll.outputs.result_code != '0')
        run: |
          echo "===== API log (last 200 lines) ====="
          tail -n 200 "$RUNNER_TEMP/pareton-logs/api.log" 2>/dev/null || true
          echo "===== Watcher log (last 200 lines) ====="
          tail -n 200 "$RUNNER_TEMP/pareton-logs/watcher.log" 2>/dev/null || true
          echo "===== Worker log (last 200 lines) ====="
          tail -n 200 "$RUNNER_TEMP/pareton-logs/worker.log" 2>/dev/null || true
          echo "===== Patch server log (last 200 lines) ====="
          tail -n 200 "$RUNNER_TEMP/pareton-logs/patch-server.log" 2>/dev/null || true

      - name: Set workflow result
        if: always() && steps.poll.outputs.result_code != ''
        env:
          RESULT_CODE: ${{ steps.poll.outputs.result_code }}
        run: |
          if [ "$RESULT_CODE" = "0" ]; then
            echo "### Testnet smoke passed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$RESULT_CODE" = "78" ] && [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "::notice::Nightly smoke skipped because no revealed submission was observed"
            echo "### Testnet smoke skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "The testnet commitment did not reveal before the timeout." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "### Testnet smoke failed" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testnet-smoke-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pareton-logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop temporary processes and remove wallet
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/pareton-pids" ]; then
            while read -r pid; do
              kill "$pid" 2>/dev/null || true
            done < "$RUNNER_TEMP/pareton-pids"
          fi
          rm -rf "$HOME/.bittensor/wallets/$CI_WALLET_NAME"
